apiVersion: v1
kind: ConfigMap
metadata: 
  name: nginx-html
  labels:
    app: nginx

data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <title>{{ .Values.html.title }}</title>
      </head>
      <body>
        <h1>{{ .Values.html.heading }}</h1>
        <p>Environment: {{ .Values.html.environment }}</p>
        <p>Version: {{ .Values.html.version }}</p>
      </body>
    </html> 
