apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-multi-staging
  namespace: argocd
spec:
  project: multi-env-lab

  source:
    repoURL: https://github.com/agha177/gitops-lab.git
    targetRevision: main
    path: kustomize/nginx/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: kustomize-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
