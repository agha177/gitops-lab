apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-multi-prod
  namespace: argocd
spec:
  project: multi-env-lab

  source:
    repoURL: https://github.com/agha177/gitops-lab.git
    targetRevision: main
    path: kustomize/nginx/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: kustomize-prod
