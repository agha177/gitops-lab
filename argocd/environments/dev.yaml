apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-multi-dev
  namespace: argocd
spec:
  project: multi-env-lab

  source:
    repoURL: https://github.com/agha177/gitops-lab.git
    targetRevision: main
    path: kustomize/nginx/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: kustomize-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
