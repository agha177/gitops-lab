apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo
  namespace: argocd

spec:
  project: nginx-lab

  source:
    repoURL: https://github.com/agha177/gitops-lab.git
    targetRevision: main
    path: charts/nginx

    helm:
      releasName: nginx-demo
      valueFiles:
        - values.yaml


  
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
