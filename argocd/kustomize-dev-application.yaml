apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-nginx-dev
  namespace: argocd

spec: 
  project: default
  
  source:
    repoURL: https://github.com/agha177/gitops-lab.git
    targetRevision: main
    path: kustomize/nginx/overlays/dev

  destination:
    server: https://kubernetes/default.svc
    namespace: kustomize-dev


  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNameSpace=true
