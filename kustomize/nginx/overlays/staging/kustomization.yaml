apiVersion: kustomize.config.k8s.io/v1beta1 
kind: Kustomization

resources:
  - ../../base

namespace: kustomize-staging

namePrefix: staging-

labels:
  - pairs:
      environment: staging
    includeSelectors: false

images:
  - name: nginx
    newTag: 1.27-alpine

replicas:
  - name: nginx
    count: 2  
