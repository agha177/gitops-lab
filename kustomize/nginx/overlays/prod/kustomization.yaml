apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: kustomize-prod

namePrefix: prod-

labels:
  - pairs:
      environment: production
      managed-by: kustomize
    includeSelectors: false

images:
  - name: nginx
    newTag: 1.27-alpine

replicas: 
  - name: nginx
    count: 3

patches:
  - path: patch-resources.yaml
