apiVersion: v1
kind: Service
metadata:
  labels:
    environment: production
    managed-by: kustomize
  name: prod-nginx-service
  namespace: kustomize-prod
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: nginx
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    environment: production
    managed-by: kustomize
  name: prod-nginx
  namespace: kustomize-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:1.28-alpine
        name: nginx
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
