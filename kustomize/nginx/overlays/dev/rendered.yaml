apiVersion: v1
kind: Service
metadata:
  labels:
    environment: development
    managed-by: kustomize
  name: dev-nginx-service
  namespace: kustomize-dev
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: nginx
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    environment: development
    managed-by: kustomize
  name: dev-nginx
  namespace: kustomize-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    containers:
    - name: nginx
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 32Mi
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: nginx
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
