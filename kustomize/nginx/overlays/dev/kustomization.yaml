apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: kustomize-dev

namePrefix: dev-

labels:
  - pairs:
      environment: development
      managed-by: kustomize
    includeSelectors: false

images:
  - name: nginx
    newTag: 1.28-alpine  

replicas:
  - name: nginx
    count: 1

patches:
  - path: patch-resources.yaml

